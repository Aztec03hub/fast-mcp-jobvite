[project]
name = "fast-mcp-jobvite"
version = "0.1.0"
description = "An MCP server for the Jobvite ATS."
requires-python = ">=3.12"
license = "Apache-2.0"  # B89 SPDX id; README section deferred with B77
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "evolv Consulting" }]

# Verbatim from DESIGN.md:1418-1420 (the pins; the block is :1366-1370). Every line is load-bearing and the comments are
# part of the specification: the fastmcp-slim line is NOT redundant. Removing only that
# line makes the resolve fail outright ("there is no version of
# fastmcp-slim[client]==4.0.0b4 ... --prerelease=allow"), which is control-tested by
# tests/test_manifest.py::test_removing_fastmcp_slim_breaks_the_resolve.
dependencies = [
  "fastmcp==4.0.0b4",
  "fastmcp-slim==4.0.0b4",   # transitive prerelease; must be named or resolution fails
  "mcp==2.1.1",              # the transitive SDK that broke a middleware with no code change
  # U3's, and the dependency slot was serialised to add it (collision 10: uv.lock
  # regenerates whole, so two units adding a dependency conflict on the whole file).
  # DESIGN.md:302-303 forbids a custom logging module and names loguru as what
  # covers it, so a stdlib-logging seam written instead of this WOULD BE the
  # forbidden module. Threat row C7 (:1741) names it as a component.
  "loguru==0.7.3",
  # U4's, added under the same serialised dependency slot (collision 10). Both
  # were ALREADY resolved transitively in uv.lock at these exact versions, so
  # `uv lock` added only the direct entries and moved no version.
  #
  # httpx2 is ADR-0007's decision and the client FastMCP itself installs: fastmcp
  # 4.0.0b4 does not install `httpx` at all. Naming it directly rather than
  # relying on the transitive is deliberate - the Jobvite client imports it, and a
  # module that imports a package nobody declared breaks the day the intermediate
  # drops it. It also ships MockTransport in the box, which is what lets the
  # credential-free test strategy add NO third-party mocking library
  # (DESIGN.md:1359-1360).
  "httpx2==2.12.0",
  # DESIGN.md:337-340 makes HR-XML a HARDENED FALLBACK rather than a handled
  # case: it appears on /v1/candidate, which we do not call, and if XML ever
  # arrives it is parsed with defusedxml and treated as an error body. Entity
  # expansion on attacker-reachable input is not a risk worth taking for a route
  # that should never respond to us.
  "defusedxml==0.7.1",
  # U1's, and it was MISSING while config.py imported it directly. It arrives
  # transitively through fastmcp-slim, so the server ran perfectly on an
  # UNDECLARED dependency - the exact failure class the three pins above exist
  # for. A fastmcp bump that drops it breaks `from pydantic_settings import
  # BaseSettings` at import time, with nothing in the manifest to have stopped
  # it. Declared because we import it DIRECTLY, not because the resolve needs
  # the name. Found by impl-u1-boot after its unit had already merged.
  "pydantic-settings==2.15.0",
]

# U1's key, and only this key (IMPLEMENTATION-PLAN.md:1273). U0 deliberately
# omitted it because it names a function U1 writes.
[project.scripts]
fast-mcp-jobvite = "fast_mcp_jobvite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_mcp_jobvite"]

[tool.uv]
prerelease = "explicit"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  # COMPLIANCE-SPEC.md:194 requires this in dev and it was absent. The licence gate
  # worked only via `uv run --with pip-licenses`, which resolves it UNPINNED on every
  # run, outside uv.lock - so the tool auditing the frozen resolve was itself unfrozen,
  # which is the one property ci.yml builds two assertions to guarantee for everything
  # else. ADR-0015 also asserted it WAS a dev dependency; it was not.
  "pip-licenses>=5",
  # DESIGN.md's "CI must also run ... pip-audit" was satisfied by NOTHING: U11 built
  # scripts/check_advisories.py to emit pip-audit's --ignore-vuln flags, and no step
  # ran pip-audit, so the ignore mechanism was fully built and connected to nothing
  # while the dependency tree went unaudited. Declared here rather than reached via
  # `uv run --with pip-audit`, which resolves UNPINNED outside uv.lock - the exact
  # defect ADR-0015 records for pip-licenses one entry above.
  "pip-audit>=2.7",
  # C8-I1 is a CRITICAL row and DESIGN.md:1624-1637's two commit-time gates are its
  # stated mitigation. `.pre-commit-config.yaml` existed and pre-commit itself was
  # declared NOWHERE, so on a fresh clone `uv sync --frozen` produced an environment
  # in which the hooks could never install: the mitigation was in force only for the
  # machine that happened to have the tool. A control absent by default is worse than
  # no control, because the repository looks protected.
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Advisory-ignore table. Owned by U11 (scripts/check_advisories.py), landed empty
# here so U11 only ever edits rows inside it - IMPLEMENTATION-PLAN.md:920-922.
#
# DESIGN.md:1513-1523: an entry is legal ONLY for an advisory our code cannot
# reach, and only with an id, a date, a written unreachability reason, and an
# expiry no more than 30 days out. Never a blanket ignore, never a raised
# threshold. check_advisories.py reads this table, emits pip-audit's
# --ignore-vuln flags from it, and exits non-zero on any expired entry.
# ---------------------------------------------------------------------------
[tool.fast-mcp-jobvite.advisory-ignores]
entries = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --strict-markers is not housekeeping here (DESIGN.md:1237-1242). This project's
# whole test strategy is "exclude the credentialed arm deliberately"; without it a
# typo in the exclusion marker's name selects nothing and the run goes green having
# tested less than it claimed.
#
# `-m "not credentialed and not network"` is the SELECTION that gives CI zero skips
# (DESIGN.md:1229-1232): a skip counts as a failure, so the excluded arms are
# deselected, never marked skipif. `-m` is last-wins, so a CI step passing its own
# -m overrides this.
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "-ra",
  "-m", "not credentialed and not network",
]

markers = [
  "credentialed: needs a real Jobvite credential. NEVER run in CI - deselected by the addopts above and collected with --collect-only so it cannot rot (DESIGN.md:1244-1249)",
  "network: needs outbound network. Deselected from the default offline suite; CI runs it as its own step",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

filterwarnings = [
  "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage. Floors are ADR-0010's, against backend/testing.md:82's branch = true.
#   80% overall floor, 85% tool modules, 90% the Jobvite client,
#   95% utils/ (the standard's own Utilities target, kept not remapped),
#   95% line / 90% branch on critical paths.
# Only the overall floor is expressible as a single fail_under; the per-module
# floors are enforced by the units that create those modules.
#
# NOT wired into addopts, and the CI coverage step is commented out with a U1
# reference, for the same reason the plan gives for the pip-audit step
# (IMPLEMENTATION-PLAN.md:206-211): src/fast_mcp_jobvite holds only __init__.py
# today, so a coverage run here reports either "No data collected" (red from the
# first run) or a vacuous 100% over an empty package. U1 lands the first real
# module and turns the step on.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/fast_mcp_jobvite"]
branch = true
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true

[tool.ruff]
# 88, not 100. python.md:35 mandates it and COMPLIANCE-SPEC.md:513 lists
# `line-length = 100` as do-not-copy item 16, inherited from fast-mcp-jira.
# It was set here and never argued: a grep for line-length across DESIGN.md,
# the plan, every ADR, DECISIONS.md and the worklogs returns nothing.
line-length = 88  # B49: the code half (python.md:35)
target-version = "py312"
src = ["src", "tests"]
# docs/reviews/*.py are the design-coupling gate harnesses. They are owned by the
# review process, predate this manifest, and CI runs them by exit code rather than
# by style. Reformatting them under a lint config written after them would rewrite
# a gate nobody asked to change.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  # COMPLIANCE-SPEC.md:205-218 verbatim. Five [STD] families were missing and are
  # added here while src/ is one file - at U8 this becomes a whole-tree diff.
  "E", "W",   # pycodestyle       [STD] python.md:28
  "W505",     # doc-line-too-long [STD] python.md:36 (B49b). Listed even
              # though "W" covers it: W505 is INERT unless max-doc-length
              # is set, so naming it here keeps the pair visible together.
  "F",        # pyflakes          [STD] quality-gates.md:63
  "I",        # isort             [STD] python.md:54-58
  "N",        # pep8-naming       [STD] python.md:62-72 (B52)
  "D",        # pydocstyle        [STD] python.md:29
  "UP",       # pyupgrade         [REC]
  "B",        # bugbear           [REC] python.md:193-206
  "S",        # bandit            [REC] agentic-coding-standard.md:123-135
  "ASYNC",    # async correctness [REC]
  "DTZ",      # naive datetimes   [STD] python.md:227, no datetime.utcnow (B51)
  "T20",      # flake8-print      [STD] observability.md:642, no print statements
  "ANN",      # annotations       [STD] python.md:76, type hints required (B50 type-hint half)
]
ignore = ["D203", "D213"]   # mutually exclusive with D211/D212

[tool.ruff.lint.pycodestyle]
# B49b. `backend/python.md:36` - "For comments and docstrings: 72
# characters" - in a document whose frontmatter is `priority: required`.
# The clause was unenforced from U0 to here, and the violation count grew
# from 367 to 1608 in the days it went unmeasured. The rule ships in the
# SAME commit as the sweep so the gate is never knowingly red.
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"       # python.md:97 (B50 docstring half)

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", "S603", "S607",  # asserts and subprocess are the point in a test
  "D103", "ANN",           # undocumented, unannotated tests are fine
  "N802",                  # test names use CAPS for emphasis, deliberately:
                           # test_the_gate_does_NOT_stop_confidential_prose_in_markdown
                           # pins a ceiling, and the capitals are load-bearing to a reader
]
# The gate script is a CLI: printing IS its interface, and its refusal message is
# the control being tested. T20 would forbid the thing the tests assert on.
"scripts/*" = ["T201", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^docs/"]

# defusedxml ships no type information (no py.typed, no bundled stubs), so under
# `strict = true` its three imports in services/jobvite_client.py are hard errors.
#
# This is an OVERRIDE rather than a `types-defusedxml` dev dependency on purpose.
# U4's dependency slot was granted for two runtime packages and collision 10
# serialises edits to uv.lock across units; adding a stub package would resolve a
# new distribution into the lock for a typing convenience, which is a larger
# footprint than the problem. The narrow cost is recorded rather than hidden: the
# `fromstring` result is `Any` inside `_raise_from_markup`, so the element walk
# there is unchecked. Every value taken off it is re-typed explicitly at the call
# site, and the entity-bomb and well-formed-XML cases in
# tests/test_jobvite_client.py cover the branch behaviourally.
[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true
